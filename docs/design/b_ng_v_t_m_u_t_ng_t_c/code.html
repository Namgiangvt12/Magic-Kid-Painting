<!-- Client-side Audio & Tactile Interaction Logic -->
<script>
    (function initColorKidsCanvas() {
      // Current active state
      let activeColor = '#38bdf8';
      let activeTool = 'bucket'; // 'bucket', 'brush', 'eraser'
      let isAudioEnabled = true;

      // Color part history stack for undo / redo
      const historyStack = [];
      const redoStack = [];

      // Audio Synthesis Web Audio API for playful pop/ding sound
      const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
      
      function playChime(freq = 520, type = 'sine', duration = 0.15) {
        if (!isAudioEnabled || !audioCtx) return;
        try {
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
      }

      // Swatch Selection
      const swatches = document.querySelectorAll('.color-swatch');
      const activeColorDot = document.getElementById('active-color-dot');
      const activeColorName = document.getElementById('active-color-name');

      swatches.forEach(swatch => {
        swatch.addEventListener('click', () => {
          swatches.forEach(s => {
            s.classList.remove('active-swatch', '-translate-y-2', 'ring-4', 'ring-offset-2', 'ring-primary', 'shadow-lg');
            s.classList.add('w-14', 'h-14');
            s.classList.remove('w-16', 'h-16');
            const star = s.querySelector('.swatch-star');
            if (star) star.classList.add('hidden');
          });

          swatch.classList.add('active-swatch', '-translate-y-2', 'ring-4', 'ring-offset-2', 'ring-primary', 'shadow-lg', 'w-16', 'h-16');
          swatch.classList.remove('w-14', 'h-14');
          const star = swatch.querySelector('.swatch-star');
          if (star) star.classList.remove('hidden');

          activeColor = swatch.getAttribute('data-color');
          const name = swatch.getAttribute('data-name');
          if (activeColorDot) activeColorDot.style.backgroundColor = activeColor;
          if (activeColorName) activeColorName.textContent = name;

          playChime(660, 'sine', 0.1);
        });
      });

      // Canvas Interactive SVG Parts
      const colorParts = document.querySelectorAll('.color-part');
      colorParts.forEach(part => {
        part.addEventListener('click', (e) => {
          e.stopPropagation();
          const prevColor = part.getAttribute('fill') || '#ffffff';
          let newColor = activeColor;

          if (activeTool === 'eraser') {
            newColor = '#ffffff';
          }

          if (prevColor === newColor) return;

          // Push to history
          historyStack.push({ element: part, prev: prevColor, next: newColor });
          redoStack.length = 0; // clear redo

          part.setAttribute('fill', newColor);
          
          // Play pop audio feedback
          playChime(880, 'triangle', 0.18);

          // Cheerful squish animation
          part.style.transformOrigin = 'center';
          part.animate([
            { transform: 'scale(1)' },
            { transform: 'scale(1.05)' },
            { transform: 'scale(1)' }
          ], { duration: 250, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' });

          // Hide hint banner after first coloring
          const hint = document.getElementById('hint-bubble');
          if (hint) {
            hint.style.opacity = '0';
          }
        });
      });

      // Undo Feature
      const undoBtn = document.getElementById('btn-undo');
      if (undoBtn) {
        undoBtn.addEventListener('click', () => {
          if (historyStack.length > 0) {
            const last = historyStack.pop();
            redoStack.push(last);
            last.element.setAttribute('fill', last.prev);
            playChime(420, 'sine', 0.12);
          }
        });
      }

      // Redo Feature
      const redoBtn = document.getElementById('btn-redo');
      if (redoBtn) {
        redoBtn.addEventListener('click', () => {
          if (redoStack.length > 0) {
            const next = redoStack.pop();
            historyStack.push(next);
            next.element.setAttribute('fill', next.next);
            playChime(580, 'sine', 0.12);
          }
        });
      }

      // Tool Switcher (Bucket / Brush / Eraser)
      const toolBucket = document.getElementById('tool-bucket');
      const toolBrush = document.getElementById('tool-brush');
      const toolEraser = document.getElementById('tool-eraser');
      const tools = [toolBucket, toolBrush, toolEraser];

      function setActiveTool(btn, tool) {
        tools.forEach(t => {
          if (t) {
            t.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_4px_0_#004c69]');
            t.classList.add('bg-surface-container-high', 'text-on-surface');
          }
        });
        if (btn) {
          btn.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_4px_0_#004c69]');
          btn.classList.remove('bg-surface-container-high', 'text-on-surface');
        }
        activeTool = tool;
        playChime(700, 'sine', 0.08);
      }

      if (toolBucket) toolBucket.addEventListener('click', () => setActiveTool(toolBucket, 'bucket'));
      if (toolBrush) toolBrush.addEventListener('click', () => setActiveTool(toolBrush, 'brush'));
      if (toolEraser) toolEraser.addEventListener('click', () => setActiveTool(toolEraser, 'eraser'));

      // Sound toggle button
      const audioToggle = document.getElementById('audio-toggle-btn');
      const audioIcon = document.getElementById('audio-icon');
      if (audioToggle) {
        audioToggle.addEventListener('click', () => {
          isAudioEnabled = !isAudioEnabled;
          if (audioIcon) {
            audioIcon.textContent = isAudioEnabled ? 'music_note' : 'music_off';
          }
          if (isAudioEnabled) playChime(800, 'sine', 0.1);
        });
      }

      // Brush Size Buttons
      const sizeBtns = document.querySelectorAll('.size-btn');
      sizeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          sizeBtns.forEach(b => {
            b.classList.remove('bg-primary', 'text-on-primary', 'font-bold', 'shadow-sm');
            b.classList.add('bg-surface-container', 'text-on-surface');
          });
          btn.classList.add('bg-primary', 'text-on-primary', 'font-bold', 'shadow-sm');
          btn.classList.remove('bg-surface-container', 'text-on-surface');
          playChime(500, 'sine', 0.08);
        });
      });

      // Finish / Celebration Modal
      const finishBtn = document.getElementById('finish-btn');
      const modal = document.getElementById('celebration-modal');
      const continueBtn = document.getElementById('modal-continue-btn');
      const modalSaveBtn = document.getElementById('modal-save-btn');

      if (finishBtn && modal) {
        finishBtn.addEventListener('click', () => {
          modal.classList.remove('hidden');
          playChime(900, 'triangle', 0.3);
          setTimeout(() => playChime(1150, 'sine', 0.4), 150);
        });
      }

      if (continueBtn && modal) {
        continueBtn.addEventListener('click', () => {
          modal.classList.add('hidden');
        });
      }

      if (modalSaveBtn && modal) {
        modalSaveBtn.addEventListener('click', () => {
          modal.classList.add('hidden');
          playChime(1200, 'sine', 0.25);
        });
      }
    })();
  </script>
